# Site Settings
locale                   : "en-US"
title                    : "Yunhe"
title_separator          : "·"
name                     : "Yunhe"
description              : "Writing and programming."
url                      : "https://yunhenk.github.io"
baseurl                  : ""
repository               : "yunhenk/yunhenk.github.io"
words_per_minute         : 160
atom_feed:
  path                   : # blank (default) uses feed.xml

# Site Author
author:
  name             : "Yunhe"
  github           : "yunhenk"


# Reading Files
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - Gemfile
  - LICENSE
  - README
  - node_modules
  - vendor
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      read_time: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: Asia/Shanghai


# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
